    question: "A chamada a CaptaParametros foi bem sucedida?"
    branches: "Sim (ramo Good) -> continua. Nao (ramo AppError) -> Set App Error. ATENCAO: a condicao actual compara com SW_NA em vez de '0'; ver rulings.CLONE-PRPINTPC, onde ficou decidido corrigir para STATUS_CODE != '0'. O rotulo acima descreve o comportamento JA CORRIGIDO."

