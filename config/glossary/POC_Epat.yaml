    description: "Decisao que uma pessoa toma quando o laco de retry se esgota e o caso cai em tratamento manual. Lido nos passos Try Again e Manually Fixed, que ficam depois do formulario MANEXC. Os dois literais NAO sao divergencia entre clones: sao passos diferentes do mesmo laco."
    values: "'R' = repetir a chamada (passo Try Again); 'OK' = dar por resolvido manualmente (passo Manually Fixed). Dominio fechado, confirmado em 2026-08-06."

